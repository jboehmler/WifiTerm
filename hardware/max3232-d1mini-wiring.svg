<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="monospace" font-size="14">
  <title>HiLetgo MAX3232 module to D1 mini clone wiring</title>
  <rect width="640" height="300" fill="#fff"/>
  <rect x="20" y="40" width="190" height="200" rx="6" fill="#eef4fb" stroke="#234" stroke-width="2"/>
  <text x="115" y="30" text-anchor="middle" font-weight="bold">MAX3232 module</text>
  <rect x="430" y="40" width="190" height="200" rx="6" fill="#eef8ee" stroke="#234" stroke-width="2"/>
  <text x="525" y="30" text-anchor="middle" font-weight="bold">D1 mini clone</text>
  <g stroke-width="2.5" fill="none">
    <line x1="210" y1="75"  x2="430" y2="75"  stroke="#222"/>
    <line x1="210" y1="125" x2="430" y2="125" stroke="#c00"/>
    <line x1="210" y1="175" x2="430" y2="175" stroke="#07a"/>
    <line x1="210" y1="215" x2="430" y2="215" stroke="#a60"/>
  </g>
  <text x="30" y="80">GND</text>       <text x="440" y="80">G</text>
  <text x="30" y="130">VCC</text>       <text x="440" y="130">3V3 (or D1)</text>
  <text x="30" y="180">TXD (out)</text> <text x="440" y="180">D7 = GPIO13 RX</text>
  <text x="30" y="220">RXD (in)</text>  <text x="440" y="220">D8 = GPIO15 TX</text>
  <text x="320" y="270" text-anchor="middle" font-size="12">If no data flows, swap D7 and D8. USB stays on GPIO1/3.</text>
</svg>
