e D1 mini from its USB.</tspan></text><text x="149.4" y="-49.99999999999999" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="start"><tspan x="149.4" dy="14">IN-</tspan></text><text x="149.4" y="-114.8" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="start"><tspan x="149.4" dy="14">IN+</tspan></text><text x="340.2" y="-49.99999999999999" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="end"><tspan x="340.2" dy="14">OUT-</tspan></text><text x="340.2" y="-114.8" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="end"><tspan x="340.2" dy="14">OUT+</tspan></text><text x="212.4" y="-19.4" dominant-baseline="ideographic" fill="black" font-size="14" font-family="sans" text-anchor="middle"><tspan x="212.4" dy="14">B-</tspan></text><text x="277.2" y="-19.4" dominant-baseline="ideographic" fill="black" font-size="14" font-family="sans" text-anchor="middle"><tspan x="277.2" dy="14">B+</tspan></text><text x="248.4" y="-107.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="248.4" dy="10">TP4056 USB-C</tspan><tspan x="248.4" dy="10">charger module</tspan><tspan x="248.4" dy="10">with protection</tspan><tspan x="248.4" dy="10">(its USB-C is the</tspan><tspan x="248.4" dy="10">unit's charge and</tspan><tspan x="248.4" dy="10">power port)</tspan></text><text x="244.79999999999998" y="106.89999999999999" dominant-baseline="hanging" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="244.79999999999998" dy="11">LiPo 3.7 V, + to B+</tspan></text><text x="136.8" y="-203.6" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="136.8" dy="11">D4 1N5817 (USB path)</tspan></text><text x="732.6" y="-194.6" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="732.6" dy="11">D1 mini 5V pin</tspan></text><text x="111.60000000000001" y="-50.4" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="end"><tspan x="111.60000000000001" dy="9">IN-: no other connection</tspan><tspan x="111.60000000000001" dy="9">(it is B-, before the</tspan><tspan x="111.60000000000001" dy="9">protection switch)</tspan></text><circle cx="425.52" cy="-100.8" r="4.32" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="452.88" cy="-100.8" r="4.32" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><text x="439.2" y="-131.6" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="439.2" dy="11">SW1 power</tspan></text><text x="518.4" y="-124.39999999999999" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="518.4" dy="11">D5 1N5817 (*)</tspan></text><text x="439.2" y="-66.8" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="439.2" dy="11">R9 100k</tspan></text><text x="516.6" y="-57.8" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="516.6" dy="11">D1 mini A0</tspan></text><text x="574.1999999999999" y="100.60000000000001" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="574.1999999999999" dy="11">D1 mini GND</tspan></text><text x="-68.39999999999999" y="231.20000000000002" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="-68.39999999999999" dy="10">(*) D5 stands in for the shield's P-FET (0.3 V drop). D4 = the shield's USB diode. SW1 only matters on battery: with USB in, the unit runs and charges.</tspan></text><circle cx="687.6" cy="-180" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circl